name: 🚀 Deploy KVS Hello World to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to Windows EC2 via SSM
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔐 AWS OIDC Auth
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: KvsDeploy-${{ github.run_number }}

      - name: ✅ Verify AWS Identity
        run: aws sts get-caller-identity

      - name: 🖥️ Check EC2 SSM Online
        run: |
          STATUS=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=${{ secrets.EC2_INSTANCE_ID }}" \
            --query "InstanceInformationList[0].PingStatus" \
            --output text \
            --region ${{ secrets.AWS_REGION }})
          echo "SSM Status: $STATUS"
          if [ "$STATUS" != "Online" ]; then
            echo "❌ EC2 not reachable via SSM"
            exit 1
          fi
          echo "✅ EC2 is Online"

      - name: 🚀 Trigger Deploy on EC2
        id: deploy
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunPowerShellScript" \
            --parameters 'commands=["powershell.exe -ExecutionPolicy Bypass -File C:\\deploy\\deploy.ps1"]' \
            --timeout-seconds 600 \
            --comment "Deploy #${{ github.run_number }} by ${{ github.actor }}" \
            --region ${{ secrets.AWS_REGION }} \
            --query "Command.CommandId" \
            --output text)
          echo "command_id=$CMD_ID" >> $GITHUB_OUTPUT
          echo "✅ SSM Command sent: $CMD_ID"

      - name: ⏳ Wait for Deploy Result
        run: |
          CMD_ID="${{ steps.deploy.outputs.command_id }}"
          for i in {1..20}; do
            sleep 15
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --region "${{ secrets.AWS_REGION }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "[$i/20] Status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "✅ Deployment Succeeded!"
              aws ssm get-command-invocation \
                --command-id "$CMD_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --region "${{ secrets.AWS_REGION }}" \
                --query "StandardOutputContent" --output text
              exit 0
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "❌ Deployment Failed!"
              aws ssm get-command-invocation \
                --command-id "$CMD_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --region "${{ secrets.AWS_REGION }}" \
                --query "StandardErrorContent" --output text
              exit 1
            fi
          done
          echo "❌ Timed out"; exit 1

      - name: 📋 Summary
        if: always()
        run: |
          echo "## 🚀 KVS Hello World Deploy"              >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |"                            >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|"                            >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | ${{ github.ref_name }} |"   >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | ${{ github.sha }} |"        >> $GITHUB_STEP_SUMMARY
          echo "| **Actor**  | ${{ github.actor }} |"      >> $GITHUB_STEP_SUMMARY
          echo "| **Run**    | #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY